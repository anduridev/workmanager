<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light only" />
    <title>WorkPA — offline</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; background: #f3f5f9; color: #0f172a; text-align: center; padding: 24px; }
      .logo { width: 56px; height: 56px; border-radius: 14px; background: #2563eb; color: #fff; display: grid; place-items: center; font-size: 28px; margin: 0 auto 14px; }
      h1 { font-size: 20px; margin: 0 0 6px; }
      p { color: #64748b; margin: 0 0 18px; }
      button { font: inherit; padding: 10px 18px; border-radius: 10px; border: 0; background: #2563eb; color: #fff; font-weight: 600; }
    </style>
  </head>
  <body>
    <div>
      <div class="logo">✓</div>
      <h1>You're offline</h1>
      <p>WorkPA needs a connection to load your tasks and reminders.</p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
